name: Daily Habr Parser

on:
  schedule:
    # Запуск каждый день в 00:00 по Гринвичу (03:00 по Москве)
    - cron: '0 0 * * *'
  # Позволяет запускать код вручную кнопкой для теста
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    # Даем права на сохранение изменений в репозиторий
    permissions:
      contents: write

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Запускаем парсер
        run: python habr_parser.py

      - name: Сохраняем обновленную базу в GitHub
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add habr_articles.db
          # Если база изменилась (появились новые статьи) — делаем коммит, иначе ничего не делаем
          git commit -m "Автоматическое обновление базы данных" || echo "Нет новых статей"
          git push
